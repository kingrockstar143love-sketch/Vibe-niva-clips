
name: Build VIBE NOVA CLIPS APK

on:
  workflow_dispatch:
  push:
    name: Build VIBE NOVA CLIPS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract app project
        run: |
          if [ -f vibe-nova-autoedit-v3.zip ]; then
            mkdir -p /tmp/vibe-nova-project
            unzip -q vibe-nova-autoedit-v3.zip -d /tmp/vibe-nova-project
            PROJECT_DIR="$(find /tmp/vibe-nova-project -name pubspec.yaml -printf '%h\n' | head -n 1)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "Could not find pubspec.yaml in the ZIP."
              exit 1
            fi
            cp -a "$PROJECT_DIR"/. .
          fi
          test -f pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-nova-clips-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project
        run: |
          unzip -o vibe-nova-clips-starter.zip -d temp
          cp -r temp/vibe-nova-clips/. .

      - name: Create Android files
        run: flutter create --platforms=android --project-name vibe_nova_clips .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-NOVA-CLIPS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
