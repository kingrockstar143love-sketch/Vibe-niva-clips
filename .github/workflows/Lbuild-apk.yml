name: Build VIBE NOVA CLIPS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Flutter project
        run: |
          if [ -f vibe-nova-autoedit-v3.zip ]; then
            mkdir -p /tmp/vibe-project
            unzip -q vibe-nova-autoedit-v3.zip -d /tmp/vibe-project
            PROJECT_DIR="$(find /tmp/vibe-project -name pubspec.yaml -printf '%h\n' | head -n 1)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: pubspec.yaml not found in ZIP"
              exit 1
            fi
            cp -a "$PROJECT_DIR"/. .
          fi
          if [ ! -f pubspec.yaml ]; then
            echo "ERROR: Flutter project not found"
            exit 1
          fi

      - name: Generate Android project files
        run: flutter create --platforms=android .
      - name: Fix Android build settings
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i '/release {/a\        isMinifyEnabled = false' android/app/build.gradle.kts
      - name: Install Flutter packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-NOVA-CLIPS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
