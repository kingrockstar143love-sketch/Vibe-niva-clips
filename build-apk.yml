name: Build VIBE NOVA CLIPS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find Flutter project
        run: |
          if [ -f vibe-nova-autoedit-v3.zip ]; then
            mkdir -p /tmp/vibe-project
            unzip -q vibe-nova-autoedit-v3.zip -d /tmp/vibe-project
            PROJECT_DIR="$(find /tmp/vibe-project -name pubspec.yaml -printf '%h\n' | head -n 1)"
            if [ -z "$PROJECT_DIR" ]; then
              echo "Flutter project not found in ZIP"
              exit 1
            fi
            cp -a "$PROJECT_DIR"/. .
          fi

          test -f pubspec.yaml

      - name: Generate Android files
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-NOVA-CLIPS-APK
          path: build/app/outputs/flutter-apk/app-release.apk
